# Actualiza los precios de la app cada día hábil: futuros de CME (Yahoo Finance) y series de FRED.
# Solo hace commit cuando cambia algún dato.
name: Precios
on:
  schedule:
    - cron: '23 22 * * 1-5'   # lunes a viernes, 16:23 en Monterrey, después del cierre de CME
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/precios.py', '.github/workflows/precios.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: precios
  cancel-in-progress: true
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar yfinance
        run: python3 -m pip install --quiet --disable-pip-version-check yfinance
      - name: Descargar precios
        run: python3 -u tools/precios.py
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- data/precios.json && git ls-files --error-unmatch data/precios.json >/dev/null 2>&1; then
            echo "Sin cambios"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/precios.json
          git commit -m "Precios al $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          curl -s -o /dev/null -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
